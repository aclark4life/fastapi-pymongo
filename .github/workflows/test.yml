name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install tools
        run: python -m pip install --upgrade ruff mypy

      - name: Ruff
        run: ruff check src tests examples

      - name: Mypy
        run: mypy src

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: test_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "9.0"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip .[dev]

      - name: Run tests
        run: python -m pytest -v

  floors:
    name: Version floors
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: test_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "9.0"

      - name: Install package and pinned floors
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install \
            "fastapi==0.110.0" "pydantic==2.10" "pydantic-settings==2.12" \
            "pymongo==4.9" "httpx==0.27.2" pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -v

  prerelease:
    # Not run per-PR: catches upcoming FastAPI/Pydantic/PyMongo releases
    # before they ship, not on every change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Dependency pre-releases
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: test_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "9.0"

      - name: Install package with dependency pre-releases
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre --upgrade .[dev]

      - name: Run tests
        run: python -m pytest -v

  floors-beanie:
    name: Version floors (beanie extra)
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: test_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "9.0"

      - name: Install package, pinned floors, and beanie floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install \
            "fastapi==0.110.0" "pydantic==2.10" "pydantic-settings==2.12" \
            "pymongo==4.9" "beanie==1.26" "httpx==0.27.2" pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -v
