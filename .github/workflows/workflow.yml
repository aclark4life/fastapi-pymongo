name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate SBOM for the built distribution
        run: |
          python -m pip install --upgrade cyclonedx-py
          mkdir -p sbom
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install --quiet dist/*.whl
          cyclonedx-py environment .sbom-venv/bin/python \
            --pyproject pyproject.toml --mc-type library --of JSON --output sbom/sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastapi-pymongo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: actions/download-artifact@v4
        if: github.event_name == 'release'
        with:
          name: sbom
          path: sbom/

      - name: Attach SBOM to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom/sbom.json
