[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-pymongo"
version = "0.1.0a0"
description = "FastAPI integration for PyMongo: Pydantic-native BSON types, client lifespan/DI, settings helpers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pymongo>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
docs = [
    "sphinx>=7.0",
    "furo",
]
beanie = [
    "beanie>=1.26",
]

[project.urls]
Homepage = "https://github.com/aclark4life/fastapi-pymongo"
Issues = "https://github.com/aclark4life/fastapi-pymongo/issues"

[tool.setuptools.packages.find]
where = ["src"]
