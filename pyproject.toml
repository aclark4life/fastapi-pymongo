[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-pymongo"
version = "0.1.0a3"
description = "FastAPI integration for PyMongo: Pydantic-native BSON types, client lifespan/DI, settings helpers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.10",
    "pydantic-settings>=2.12",
    "pymongo>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
]
beanie = [
    "beanie>=1.26",
]

[project.urls]
Homepage = "https://github.com/aclark4life/fastapi-pymongo"
Issues = "https://github.com/aclark4life/fastapi-pymongo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is FastAPI's documented idiom.
ignore = ["B008"]

[tool.mypy]
# pymongo has no stubs on PyPI; the driver's own annotations cover our usage.
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = '-m "not perf"'
markers = [
    "perf: performance overhead tests, run explicitly with `pytest -m perf`",
    "integration: tests that require a running MongoDB deployment",
]
